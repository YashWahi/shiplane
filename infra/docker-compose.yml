version: "3.8"

services:
  postgres:
    image: postgres:17-alpine
    container_name: nebula-postgres
    restart: always
    environment:
      POSTGRES_USER: nebula
      POSTGRES_PASSWORD: nebula
      POSTGRES_DB: nebula
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nebula"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nebula-net

  redis:
    image: redis:7-alpine
    container_name: nebula-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nebula-net

  minio:
    image: alpine/minio:latest-release
    container_name: nebula-minio
    restart: always
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - nebula-net

  traefik:
    image: traefik:v3.1
    container_name: nebula-traefik
    restart: always
    ports:
      - "8081:80"
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - nebula-net

networks:
  nebula-net:
    name: nebula-net
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
